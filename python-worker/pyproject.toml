[project]
name = "al-iyaal-worker"
version = "0.1.0"
description = "MLX audio worker sidecar for al-iyaal kids Tauri app"
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.4.0"]
demucs-bootstrap = ["demucs-mlx[convert]==1.4.4"]
runtime = [
    "better-profanity==0.7.0",
    "demucs-mlx==1.4.4",
    "soundfile==0.13.1",
    "torch==2.13.0",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools.package-data]
al_iyaal_worker = ["moderation/prompts/*.txt"]
